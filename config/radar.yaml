# Live radar config (operator, 2026-11-24). Used by compose.yaml as /config/radar.yaml.
# No secrets here: Telegram settings are in .env, the Guard login in the state volume.
messages:
  language: ru
digest:
  weekday: friday
  hour_utc: 1
high:
  # High priority (operator, 2026-11-23): only these audit types alert; every other type is
  # digest-only.
  high_priority_audit_types:
    - audit.security
    - audit.dependency-vulnerabilities
    - audit.dependency-aging
    - audit.authentication-handling
    - audit.tech-health
    - audit.config-hygiene
    - audit.dependency-hygiene
    - audit.secrets-handling
    - audit.public-api-access-safety
