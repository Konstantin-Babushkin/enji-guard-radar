# enji-guard-radar example config: every key with its default.
# Unknown keys, duplicated keys and out-of-range values stop the run (exit 2).
# Secrets (TELEGRAM_BOT_TOKEN, CLAUDE_CODE_OAUTH_TOKEN, Guard credentials) never go in this file:
# they come from the environment or .env.

defaults:
  # A project is stale when its newest completed Guard run is at least this many days old (1..365).
  stale_after_days: 14
  # A (repo, audit type) with High findings for longer than this many days is flagged
  # long-standing (1..365). Age counts from the completed_at of the first High run the radar
  # saw, shown as "Seen by the radar since <date>".
  high_aged_after_days: 14

alerts:
  # More alert lines than this are sent as one summary message (1..50). A project's High
  # findings are one line (total count, audit types, oldest age), stale and never-ran are their own.
  collapse_above: 3

high:
  # A High series clears only after this many consecutive completed runs with zero High
  # findings (1..10).
  clear_after_clean_runs: 2
  # Audit types that alert (and are reminded about and triaged). null = every audit type is high
  # priority. A list = exactly those; every other audit type is still tracked, but it never sends
  # an alert or a reminder and is shown only in the "Low priority" block of the weekly digest.
  # audit.recon never has High findings. The old name `audit_types` still works but is deprecated;
  # setting both is an error. The operator's set:
  # high_priority_audit_types:
  #   - audit.security
  #   - audit.dependency-vulnerabilities
  #   - audit.dependency-aging
  #   - audit.authentication-handling
  #   - audit.tech-health
  #   - audit.config-hygiene
  #   - audit.dependency-hygiene
  #   - audit.secrets-handling
  #   - audit.public-api-access-safety
  high_priority_audit_types: null

# Radar health. After this many failed Guard polls in a row, one message goes to
# TELEGRAM_OPS_CHAT_ID, and one more when polls work again (1..20).
ops:
  failures_before_alert: 3

# When `enji-guard-radar serve` polls (the Docker Compose service runs it). Slots are multiples of
# every_minutes counted from 00:00 UTC, so 180 means 00:00, 03:00, 06:00, ... UTC. The value must
# divide 1440 (1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20, 24, 30, 36, 40, 45, 48, 60, 72, 80, 90,
# 120, 144, 180, 240, 288, 360, 480, 720, 1440). `serve` takes the value again after every poll, so
# a change here or in the settings sheet applies from the next slot without a restart; `run`
# ignores this section.
schedule:
  every_minutes: 180

# Language of every Telegram message the radar sends (group alerts, summary, reminders, digest,
# ops chat): en | ru. Log lines, doctor output and CLI errors always stay English.
messages:
  language: en

# Weekly digest (D-01, D-02, D-06). Day and hour are UTC.
digest:
  # monday .. sunday, lowercase.
  weekday: wednesday
  # Hour of the day, 0..23.
  hour_utc: 5
  # A digest not acknowledged within this many hours of its planned moment is skipped for
  # that week (1..168).
  grace_hours: 24
  # Items listed in one digest before the rest is summarised (3..50).
  max_items: 10

# Reminders (D-11): an unresolved finding is reminded about every this many days (1..90).
reminders:
  every_days: 7

# Score rules (D-08). null = rule off (digest only). A score strictly below the number is
# flagged (0..100). A per-project value overrides this; 0 disables the rule for one project.
scores:
  ai_readiness_below: null
  tests_below: null

# Recurring findings (D-09): present in this many consecutive completed runs (2..20).
recurring:
  after_runs: 3

# Tooling gaps (D-10): an audit type with no completed run in window_days (7..365) is a gap.
# audit_types is a non-empty list of audit.<name>, no repeats; it cannot be null.
tooling_gaps:
  window_days: 60
  audit_types:
    - audit.dead-code
    - audit.implementation-unification
    - audit.security
    - audit.dependency-hygiene

# Claude triage (D-03, D-13): one extra Claude line on fresh High alerts. Ships OFF.
# Needs the verified Claude CLI route (plan 04-01) and CLAUDE_CODE_OAUTH_TOKEN in the env file.
# Rules still decide whether to alert; Claude only explains and prioritises. A bad or missing
# reply leaves the plain rule message.
triage:
  # true turns triage on.
  enabled: false
  # Only claude_cli (the local `claude` CLI) is supported.
  backend: claude_cli
  # A short model name or alias: letters, digits, . _ - ; up to 64 characters, no spaces.
  model: haiku
  # At most this many items go to Claude in one call (1..100).
  max_items_per_call: 30
  # One call may take at most this many seconds (5..300).
  timeout_seconds: 60
  # Budget for one call in US dollars (0.01..5).
  max_cost_usd_per_call: 0.50

# Settings from a Google Sheet (docs/deploy.md, "Settings from a Google Sheet"). Ships OFF.
# When enabled, every poll reads the sheet and its values override this file field by field
# (an empty cell means "not set": the value here applies). An unreachable or invalid sheet keeps
# the last good copy (state/sheet-settings.json) and tells the ops chat once. The service account
# key is a secret: it goes in the env file as GOOGLE_SERVICE_ACCOUNT_JSON, never in this file.
# The sheet cannot set triage, ops or sheet values, and cannot reset a value here to null.
sheet:
  enabled: false
  # The long id in the sheet's address: https://docs.google.com/spreadsheets/d/<spreadsheet_id>/edit
  # spreadsheet_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789

# Per-project settings, keyed by Guard project id. Override beats defaults.
# mode: active (default) | paused (listed as "not checked", no Guard calls) | excluded (ignored).
#
# projects:
#   "00000000-0000-4000-8000-00000000a002":
#     stale_after_days: 30
#     high_aged_after_days: 30
#     ai_readiness_below: 60    # 0..100; 0 disables the rule for this project
#     tests_below: 50           # 0..100; 0 disables the rule for this project
#     tooling_window_days: 90   # 7..365
#     reminder_every_days: 3    # 1..90; this project's reminder interval instead of reminders.every_days
#     high_priority_audit_types:  # non-empty list; instead of high.high_priority_audit_types
#       - audit.security
#       - audit.dependency-vulnerabilities
#   "00000000-0000-4000-8000-00000000a005":
#     mode: paused
#   "00000000-0000-4000-8000-00000000a006":
#     mode: excluded
projects: {}
